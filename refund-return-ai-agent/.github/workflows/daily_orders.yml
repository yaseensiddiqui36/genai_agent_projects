name: Generate Daily Synthetic Orders

# Streamlit Community Cloud has no background-job support, so this workflow is
# the "clock" for the demo: it runs once a day, generates a fresh batch of
# synthetic orders dated around today, and commits data/orders.csv back to the
# repo. Streamlit Cloud auto-redeploys on push, and the app rebuilds its
# SQLite database from the CSVs on boot - so the deployed demo always has
# orders whose return-window eligibility is actually testable, instead of
# aging out of every product's window as the static seed data gets older.

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily
  workflow_dispatch: {} # allow manual runs from the Actions tab

permissions:
  contents: write

jobs:
  generate-orders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      - name: Generate synthetic orders
        run: uv run python scripts/generate_daily_orders.py --count 100

      - name: Commit updated order data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/orders.csv
          git diff --cached --quiet || git commit -m "chore: daily synthetic order batch ($(date -u +%Y-%m-%d))"
          git push
