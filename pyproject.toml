[project]
name = "refund-request-handling-ai-system"
version = "0.1.0"
description = "Multi-agent LangGraph refund/return processing system with a Streamlit chat interface"
readme = "README.md"
authors = [
    { name = "yaseensiddiqui36", email = "yaseensiddiqui36@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "faiss-cpu>=1.15.0",
    "faker>=40.36.0",
    "google-api-python-client>=2.198.0",
    "google-auth>=2.56.3",
    "google-auth-oauthlib>=1.4.0",
    "langchain>=1.3.14",
    "langchain-community>=0.4.2",
    "langchain-core>=1.5.3",
    "langchain-groq>=0.2.5",
    "langchain-huggingface>=0.1.2",
    "langgraph>=1.2.10",
    "langgraph-supervisor>=0.0.31",
    "numpy>=2.4.6",
    "pandas>=3.0.5",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "sentence-transformers>=3.3.1",
    "sqlalchemy>=2.0.51",
    "streamlit>=1.61.1",
    "tqdm>=4.70.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
